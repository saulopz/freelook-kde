<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="60" height="30" viewBox="0 0 60 30">
 <style type="text/css" id="current-color-scheme">
  .ColorScheme-Background { color:#cccccc; stop-color:#cccccc; }
  .ColorScheme-Text { color:#000000; stop-color:#000000; }
 </style>
 <g id="topleft">
  <rect x="0" y="0" width="3" height="3" fill="#000000" fill-opacity="0"/>
  <rect x="0" y="0" width="3" height="3" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="1" y="1" width="2" height="2" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="1" y="1" width="2" height="1" fill="#ffffff"/>
  <rect x="1" y="1" width="1" height="2" fill="#ffffff"/>
 </g>
 <g id="top">
  <rect x="3" y="0" width="20" height="3" fill="#000000" fill-opacity="0"/>
  <rect x="3" y="0" width="20" height="3" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="3" y="1" width="20" height="2" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="3" y="1" width="20" height="1" fill="#ffffff"/>
 </g>
 <g id="topright">
  <rect x="23" y="0" width="3" height="3" fill="#000000" fill-opacity="0"/>
  <rect x="23" y="0" width="3" height="3" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="23" y="1" width="2" height="2" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="23" y="1" width="2" height="1" fill="#ffffff"/>
  <rect x="24" y="1" width="1" height="2" fill="#808080"/>
 </g>
 <g id="left">
  <rect x="0" y="3" width="3" height="20" fill="#000000" fill-opacity="0"/>
  <rect x="0" y="3" width="3" height="20" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="1" y="3" width="2" height="20" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="1" y="3" width="1" height="20" fill="#ffffff"/>
 </g>
 <g id="center">
  <rect x="3" y="3" width="20" height="20" fill="#000000" fill-opacity="0"/>
  <rect x="3" y="3" width="20" height="20" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="3" y="3" width="20" height="20" class="ColorScheme-Background" fill="currentColor"/>
 </g>
 <g id="right">
  <rect x="23" y="3" width="3" height="20" fill="#000000" fill-opacity="0"/>
  <rect x="23" y="3" width="3" height="20" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="23" y="3" width="2" height="20" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="24" y="3" width="1" height="20" fill="#808080"/>
 </g>
 <g id="bottomleft">
  <rect x="0" y="23" width="3" height="3" fill="#000000" fill-opacity="0"/>
  <rect x="0" y="23" width="3" height="3" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="1" y="23" width="2" height="2" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="1" y="23" width="1" height="2" fill="#ffffff"/>
  <rect x="1" y="24" width="2" height="1" fill="#808080"/>
 </g>
 <g id="bottom">
  <rect x="3" y="23" width="20" height="3" fill="#000000" fill-opacity="0"/>
  <rect x="3" y="23" width="20" height="3" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="3" y="23" width="20" height="2" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="3" y="24" width="20" height="1" fill="#808080"/>
 </g>
 <g id="bottomright">
  <rect x="23" y="23" width="3" height="3" fill="#000000" fill-opacity="0"/>
  <rect x="23" y="23" width="3" height="3" class="ColorScheme-Text" fill="currentColor"/>
  <rect x="23" y="23" width="2" height="2" class="ColorScheme-Background" fill="currentColor"/>
  <rect x="23" y="24" width="2" height="1" fill="#808080"/>
  <rect x="24" y="23" width="1" height="2" fill="#808080"/>
 </g>
  <rect id="hint-top-margin" x="40" y="0" width="1" height="3" fill="#ff00ff" fill-opacity="0"/>
  <rect id="hint-bottom-margin" x="42" y="0" width="1" height="3" fill="#ff00ff" fill-opacity="0"/>
  <rect id="hint-left-margin" x="40" y="20" width="3" height="1" fill="#ff00ff" fill-opacity="0"/>
  <rect id="hint-right-margin" x="40" y="22" width="3" height="1" fill="#ff00ff" fill-opacity="0"/>
</svg>
